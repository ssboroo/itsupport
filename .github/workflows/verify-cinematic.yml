name: Verify cinematic IT support update

on:
  push:
    branches: [feature/cinematic-it-rainy]
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify-cinematic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cinematic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run cinematic regression tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Build production bundle
        run: pnpm build
